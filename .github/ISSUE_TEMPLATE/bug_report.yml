name: Bug Report
description: File a structured bug report
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the form below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the problem...
    validations:
      required: true
  - type: textarea
    id: reproducibility
    attributes:
      label: Reproducible Code Snippet
      description: Please provide a minimal Kotlin code snippet or test case to reproduce the behavior.
      placeholder: |
        // Put your reproducible Kotlin code here
      render: kotlin
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true
  - type: dropdown
    id: version
    attributes:
      label: Engine Version
      description: What version of the engine are you using?
      options:
        - 0.1.0-alpha
        - Other (please specify in environment details)
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please specify the OS, JDK version, Kotlin version, and any other relevant environmental details.
      placeholder: |
        OS: macOS
        JDK: 17
        Kotlin: 2.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Verification Logs
      description: Relevant stacktraces, build tool logs, or solver verification outputs.
      render: text
