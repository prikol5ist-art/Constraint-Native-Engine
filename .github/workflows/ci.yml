name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92
      - name: Test and verify public contract
        shell: bash
        run: ./gradlew clean test koverVerify apiCheck dokkaHtmlMultiModule --dependency-verification=strict
      - name: Verify payload evidence artifacts
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./gradlew :benchmark:verifyEvidence
      - name: Run public snapshot scanner
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: ./scripts/verify-public-snapshot.sh .

