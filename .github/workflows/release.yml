name: Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Verify and Publish Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Run verification suite
        run: ./gradlew clean test koverVerify apiCheck dokkaHtmlMultiModule :benchmark:verifyEvidence --dependency-verification=strict
      - name: Run snapshot scanner
        run: ./scripts/verify-public-snapshot.sh .
      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal
      # Placeholders for Maven Central publication and GitHub release draft creation
      - name: Create Release Draft
        uses: softprops/action-gh-release@de2c0eb89ae2a0938763859eb24137b0686917cd
        with:
          draft: true
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
